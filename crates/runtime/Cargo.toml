[package]
name = "tabula-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
tabula-core = { workspace = true }
tabula-ir = { workspace = true }
tabula-artifact = { workspace = true }
tabula-contract = { workspace = true }
tabula-compiler = { workspace = true }
tabula-ext = { workspace = true, default-features = false }
tabula-executor = { workspace = true }

# STARK proving dependencies (optional, behind `prove` feature)
tabula-machine = { workspace = true, optional = true }
tabula-chips = { workspace = true, optional = true }
tabula-stark = { workspace = true, optional = true }
tabula-witness = { workspace = true, optional = true }
tabula-commitment = { workspace = true, optional = true, features = ["stark"] }
p3-koala-bear = { workspace = true, optional = true }
p3-field = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }

[features]
default = []
verify = [
    "tabula-ext/verify",
    "dep:tabula-machine",
    "dep:tabula-chips",
    "dep:tabula-stark",
    "dep:tabula-commitment",
    "dep:serde",
    "dep:serde_json",
    "dep:sha2",
]
prove = [
    "verify",
    "tabula-ext/prove",
    "dep:tabula-witness",
    "dep:tabula-commitment",
    "dep:p3-koala-bear",
    "dep:p3-field",
    "dep:rayon",
]

[dev-dependencies]
tabula-core = { workspace = true, features = ["test-utils"] }
tabula-testing = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
