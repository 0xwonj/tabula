<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tabula</title>
    <script>
      // Set theme before CSS paints to prevent flash.
      (function () {
        var t = localStorage.getItem('tabula.theme');
        if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
      })();
    </script>
    <link data-trunk rel="rust" data-bin="tabula-web" />
    <link data-trunk rel="css" href="styles/base.css" />
    <link data-trunk rel="css" href="styles/nav.css" />
    <link data-trunk rel="css" href="styles/landing.css" />
    <link data-trunk rel="css" href="styles/playground.css" />
  </head>
  <body></body>
</html>
