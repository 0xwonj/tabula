[package]
name = "tabula-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
axum = "0.7"
clap = { workspace = true, features = ["derive", "env"] }
http = "1"
serde = { workspace = true }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

tabula-core = { workspace = true, features = ["mock"] }
tabula-contract = { workspace = true }
tabula-driver = { workspace = true }
tabula-executor = { workspace = true }
tabula-ir = { workspace = true }
tabula-lang = { workspace = true }
