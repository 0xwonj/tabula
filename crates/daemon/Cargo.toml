[package]
name = "tabula-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
axum = "0.7"
clap = { workspace = true, features = ["derive", "env"] }
http = "1"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

tabula-artifact = { workspace = true }
tabula-core = { workspace = true, features = ["test-utils"] }
tabula-driver = { workspace = true }
tabula-ir = { workspace = true }
tabula-chips = { workspace = true, optional = true }
tabula-machine = { workspace = true, optional = true }
tabula-witness = { workspace = true, optional = true }
tabula-commitment = { workspace = true, optional = true }
tabula-lang = { workspace = true, optional = true }
p3-baby-bear = { workspace = true, optional = true }
p3-field = { workspace = true, optional = true }
sha2 = { workspace = true }

[features]
default = []
stark = ["dep:tabula-chips", "dep:tabula-machine", "dep:tabula-witness", "dep:tabula-commitment", "tabula-commitment/stark", "dep:tabula-lang", "dep:p3-baby-bear", "dep:p3-field"]
