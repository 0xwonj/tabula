[package]
name = "tabula-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["compile", "execute"]
compile = []
execute = [
    "dep:tabula-executor",
    "dep:tabula-machine",
    "tabula-ext/verify",
    "tabula-runtime/verify",
]
prove = [
    "verify",
    "tabula-ext/prove",
    "tabula-runtime/prove",
]
verify = ["execute"]
advanced = []

[dependencies]
borsh = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tabula-commitment = { workspace = true }
tabula-contract = { workspace = true }
tabula-compiler = { workspace = true }
tabula-core = { workspace = true }
tabula-ir = { workspace = true }
tabula-types = { workspace = true }
tabula-ext = { workspace = true, default-features = false }
tabula-profile = { workspace = true }
tabula-runtime = { workspace = true, default-features = false }
tabula-executor = { workspace = true, optional = true }
tabula-machine = { workspace = true, optional = true }

[dev-dependencies]
tabula-ext = { workspace = true, features = ["prove"] }
tabula-testing = { workspace = true }

[lints]
workspace = true

[[example]]
name = "membership"
required-features = ["compile", "execute"]
