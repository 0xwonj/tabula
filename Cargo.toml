[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/contract",
    "crates/ir",
    "crates/executor",
    "crates/commitment",
    "crates/stark",
    "crates/gadgets",
    "crates/chips",
    "crates/witness",
    "crates/machine",
    "crates/lang",
    "crates/artifact",
    "crates/runtime",
    "crates/compiler",
    "crates/ext",
    "crates/sdk",
    "crates/cli",
    "crates/daemon",
    "crates/web",
    "crates/testing",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Wonjae Choi <wonjae@snu.ac.kr>"]
license = "MIT OR Apache-2.0"

# Feature matrix:
#   default  — core types, IR, executor, lang, CLI (no crypto proofs)
#   stark    — enables Plonky3 STARK prover/verifier + Poseidon2 + commitment layer
#   test-utils — mock crypto impls for testing (tabula-core)

[workspace.dependencies]
# Internal
tabula-core = { path = "crates/core" }
tabula-contract = { path = "crates/contract" }
tabula-ir = { path = "crates/ir" }
tabula-executor = { path = "crates/executor" }
tabula-commitment = { path = "crates/commitment" }
tabula-stark = { path = "crates/stark" }
tabula-gadgets = { path = "crates/gadgets" }
tabula-chips = { path = "crates/chips" }
tabula-witness = { path = "crates/witness" }
tabula-machine = { path = "crates/machine" }
tabula-lang = { path = "crates/lang" }
tabula-artifact = { path = "crates/artifact" }
tabula-runtime = { path = "crates/runtime" }
tabula-compiler = { path = "crates/compiler" }
tabula-ext = { path = "crates/ext", default-features = false }
tabula-sdk = { path = "crates/sdk" }
tabula-testing = { path = "crates/testing" }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = { version = "1", features = ["derive"] }

# Crypto
blake3 = "1"
sha2 = "0.10"

# Plonky3
p3-field = "0.5"
p3-koala-bear = "0.5"
p3-monty-31 = "0.5"
p3-poseidon2 = "0.5"
p3-symmetric = "0.5"
p3-air = "0.5"
p3-matrix = "0.5"
p3-uni-stark = "0.5"
p3-commit = "0.5"
p3-fri = "0.5"
p3-challenger = "0.5"
p3-dft = "0.5"
p3-merkle-tree = "0.5"
p3-blake3 = "0.5"

# Parallelism
rayon = "1.10"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# CLI
clap = { version = "4", features = ["derive"] }

# Testing
proptest = "1"
criterion = { version = "0.8", features = ["html_reports"] }

# ── Workspace-level lints ─────────────────────────────────────────────────────

[workspace.lints.rust]
missing_docs = "warn"
unused = { level = "deny", priority = -1 }

[workspace.lints.clippy]
# style
cloned_instead_of_copied = "warn"
explicit_into_iter_loop = "warn"
implicit_clone = "warn"
inconsistent_struct_constructor = "warn"
inefficient_to_string = "warn"
manual_let_else = "warn"
redundant_closure_for_method_calls = "warn"
semicolon_if_nothing_returned = "warn"
uninlined_format_args = "warn"
unnested_or_patterns = "warn"
flat_map_option = "warn"
manual_assert = "warn"
map_unwrap_or = "warn"
needless_for_each = "warn"
# performance
needless_pass_by_value = "warn"
trivially_copy_pass_by_ref = "warn"
large_enum_variant = "warn"
unused_self = "warn"
# namespace hygiene
wildcard_imports = "warn"
enum_glob_use = "warn"

# ── Build profiles ────────────────────────────────────────────────────────────

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 2

[profile.release]
lto = "thin"

[profile.bench]
lto = "thin"
