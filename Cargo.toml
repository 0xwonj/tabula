[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/contract",
    "crates/ir",
    "crates/executor",
    "crates/commitment",
    "crates/stark",
    "crates/gadgets",
    "crates/chips",
    "crates/witness",
    "crates/machine",
    "crates/lang",
    "crates/artifact",
    "crates/driver",
    "crates/cli",
    "crates/daemon",
    "crates/web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Wonjae Choi <wonjae@snu.ac.kr>"]
license = "MIT OR Apache-2.0"

# Feature matrix:
#   default  — core types, IR, executor, lang, CLI (no crypto proofs)
#   stark    — enables Plonky3 STARK prover/verifier + Poseidon2 + commitment layer
#   test-utils — mock crypto impls for testing (tabula-core)

[workspace.dependencies]
# Internal
tabula-core = { path = "crates/core" }
tabula-contract = { path = "crates/contract" }
tabula-ir = { path = "crates/ir" }
tabula-executor = { path = "crates/executor" }
tabula-commitment = { path = "crates/commitment" }
tabula-stark = { path = "crates/stark" }
tabula-gadgets = { path = "crates/gadgets" }
tabula-chips = { path = "crates/chips" }
tabula-witness = { path = "crates/witness" }
tabula-machine = { path = "crates/machine" }
tabula-lang = { path = "crates/lang" }
tabula-artifact = { path = "crates/artifact" }
tabula-driver = { path = "crates/driver" }
# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
borsh = { version = "1", features = ["derive"] }

# Crypto
blake3 = "1"
sha2 = "0.10"

# Plonky3 (BabyBear + Poseidon2 + AIR + STARK)
p3-field = "0.4"
p3-baby-bear = "0.4"
p3-poseidon2 = "0.4"
p3-symmetric = "0.4"
p3-air = "0.4"
p3-matrix = "0.4"
p3-uni-stark = "0.4"
p3-commit = "0.4"
p3-fri = "0.4"
p3-challenger = "0.4"
p3-dft = "0.4"
p3-merkle-tree = "0.4"

# Error handling
thiserror = "2"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# CLI
clap = { version = "4", features = ["derive"] }

# Testing
proptest = "1"
criterion = { version = "0.8", features = ["html_reports"] }

# Build profiles
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"

[profile.bench]
lto = "thin"
